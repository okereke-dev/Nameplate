plugins {
	// 26.x is unobfuscated: use the new plugin id, which skips all
	// remapping (there's nothing to remap to/from anymore).
	id 'net.fabricmc.fabric-loom' version '1.17.16'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Some upstream mavens (terraformersmc, shedaniel) intermittently
	// truncate HTTP/2 chunked downloads in this environment (confirmed via
	// curl: --http1.1 succeeds, plain https fails at a random byte offset
	// each time). Any artifact that hits this gets manually re-downloaded
	// with --http1.1 and seeded here so Gradle finds it locally first.
	mavenLocal()
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://maven.terraformersmc.com/" }
	maven { url "https://api.modrinth.com/maven" }
}

dependencies {
	// No mappings block at all: 26.x ships with real names already, there's
	// nothing to map. "mod*" configurations also stop meaning anything
	// special once there's no remapping step, so they're plain
	// implementation/compileOnly/runtimeOnly below.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Cloth
	implementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
	// ModMenu
	compileOnly runtimeOnly("com.terraformersmc:modmenu:${project.mod_menu_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
	// RpgDifficulty — compileOnly stub against the old 1.21.1 artifact for
	// now; rewired to our own ported 26.2 build once that's done (see
	// NameplateTracker's use of net.rpgdifficulty.access.EntityAccess).
	compileOnly ('maven.modrinth:rpgdifficulty:1.3.17+1.21.1'){
		exclude(group: "net.fabricmc.fabric-api")
	}
	// GeckoLib/Jade/WTHIT/original-"Traveler's Titles" compat code was
	// removed in this port (see NameplateMixinPlugin) — none of those mods
	// have a 26.x build, and our pack doesn't install any of them anyway.
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version, "fabric_version": project.fabric_version, "loader_version": project.loader_version, "minecraft_version": project.minecraft_version, "cloth_config_version": project.cloth_config_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
