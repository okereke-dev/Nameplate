# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G

# Fabric Properties
	# 26.x is unobfuscated: no mappings needed at all (not Yarn, not Mojang's
	# own client_mappings — Mojang stopped shipping those from 26.1 on).
	minecraft_version=26.2
	loader_version=0.19.3

# Mod Properties
	mod_version = 1.1.7-26.2
	maven_group = net.nameplate
	archives_base_name = nameplate

# Dependencies
	# currently not on the main fabric site, check on the maven: https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api
	fabric_version=0.155.2+26.2
	cloth_config_version=26.2.155
	mod_menu_version=20.0.1
